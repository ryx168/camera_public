name: 3-Hour Motion Check

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check-motion:
    runs-on: ubuntu-latest
    environment: camera-access
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp opencv-contrib-python-headless

      - name: Run motion check
        run: python check_recent_motion.py
        
      - name: Send Report Email
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python -c "
          import os, smtplib
          from email.mime.text import MIMEText

          body = 'No report file generated.'
          if os.path.exists('report.txt'):
              with open('report.txt', 'r', encoding='utf-8') as f:
                  body = f.read()

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = 'Twitch Motion Check Report'
          msg['From'] = os.environ.get('SMTP_FROM') or 'harry@superesolutions.com'
          msg['To'] = 'harry@superesolutions.com'

          smtp_host = os.environ.get('SMTP_SERVER') or 'smtp.postmarkapp.com'
          smtp_port = int(os.environ.get('SMTP_PORT') or 587)
          smtp_user = os.environ.get('SMTP_USERNAME') or '8f23463b-5db0-4bfb-9adc-fa13016656d2'
          smtp_pass = os.environ.get('SMTP_PASSWORD') or '8f23463b-5db0-4bfb-9adc-fa13016656d2'

          print(f'Connecting to {smtp_host}:{smtp_port}...')
          with smtplib.SMTP(smtp_host, smtp_port, timeout=15) as server:
              server.starttls()
              server.login(smtp_user, smtp_pass)
              server.send_message(msg)
          print('Report email delivered successfully!')
          "



