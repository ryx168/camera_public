name: 3-Hour Motion Check

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check-motion:
    runs-on: ubuntu-latest
    environment: camera-access
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp opencv-python-headless

      - name: Run motion check
        run: python check_recent_motion.py
        
      - name: Send Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || secrets.SMTP_HOST || 'smtp.postmarkapp.com' }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USERNAME || secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
          subject: Twitch Motion Check Report
          to: harry@superesolutions.com
          from: harry@supere.ca
          body: file://report.txt
