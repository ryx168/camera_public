name: 3-Hour Motion Check

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check-motion:
    runs-on: ubuntu-latest
    environment: camera-access
    timeout-minutes: 60
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset report and snapshots
        run: rm -f report.txt snapshot_*.jpg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
          python -m pip install --upgrade pip
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install --no-cache-dir yt-dlp opencv-contrib-python-headless pytesseract
          python -c "import cv2, pytesseract; print('OpenCV:', cv2.__version__); print('HOGDescriptor present:', hasattr(cv2, 'HOGDescriptor')); print('Tesseract:', pytesseract.get_tesseract_version())"

      - name: Restore shared temp_vods cache
        uses: actions/cache@v4
        with:
          path: temp_vods/
          key: temp-vods-${{ github.run_id }}
          restore-keys: |
            temp-vods-

      - name: Run motion check (House - Cam 2 Bottom 80%)
        timeout-minutes: 25
        env:
          CHECK_AREA: "house_around"
          TARGET_OBJECT: "person"
          ROI_Y_MIN: "0.20"
          ROI_Y_MAX: "1.0"
          ROI_X_MIN: "0.0"
          ROI_X_MAX: "1.0"
          MOTION_THRESHOLD: "25000"
          MIN_CONFIDENCE: "0.70"
          MIN_PERSON_HEIGHT: "110"
          DIFF_THRESHOLD: "35"
        run: python check_recent_motion.py
        
      - name: Run motion check (Garage - Cam 3)
        if: always()
        timeout-minutes: 25
        env:
          CHECK_AREA: "garage"
          TARGET_OBJECT: "car"
          ROI_Y_MIN: "0.20"
          ROI_Y_MAX: "1.0"
          ROI_X_MIN: "0.0"
          ROI_X_MAX: "1.0"
          MOTION_THRESHOLD: "35000"
          DIFF_THRESHOLD: "35"
        run: python check_recent_motion.py

      - name: Send Report Email with Detection Screenshots
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: 'harry@superesolutions.com'
        run: python send_motion_email.py

      - name: Upload Motion Snapshots and Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-check-artifacts
          path: |
            snapshot_*.jpg
            report.txt
          if-no-files-found: ignore

      - name: Cleanup temp VODs
        if: always()
        run: rm -rf temp_vods/
