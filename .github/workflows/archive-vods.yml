name: Archive VODs to Drive

# Archives the Twitch VODs - the FOOTAGE - to Google Drive from a runner.
#
# This replaces the QNAP's `camera-live` container, which ran ffmpeg against
# the Twitch live stream 24/7 and wrote 60-second segments into
# /share/CACHEDEV1_DATA/camera_archive: 886 GB and ~12 MB/min on the SAME thin
# pool (tp1) as rack1's mail LUN, behind a 2.9 Mbps house uplink. The archive
# was competing with the mail store for disk and with everything else for
# upload.
#
# None of that work needs to happen at the house. Twitch holds every VOD for
# 7 days, so a runner fetches them cloud-to-cloud and writes straight to Drive;
# the home connection is never involved. Same reasoning, and the same Drive
# remote, as the Camera Summary workflow - that one caches the ANALYSIS, this
# one archives the footage, which was the missing half.
#
# No camera access and no Tailscale: Twitch is public and Drive is a secret.

on:
  schedule:
    # Offset from the stream workflow ('0 */6') and the summary workflow
    # ('20 */6') so the three do not start together.
    #
    # The cadence deliberately does NOT live here. Per the measurement
    # recorded in summary.yml, this repository is granted roughly five
    # scheduled runs a DAY whatever the cron asks for - surplus ticks are
    # silently discarded, not delayed. So this cron only has to start one long
    # job, and the real interval lives in the loop below.
    - cron: '40 */6 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How far back to consider VODs. Twitch keeps 7 days."
        required: false
      loop_minutes:
        description: "How long to keep archiving. 0 = a single pass and exit."
        required: false
      retain_days:
        description: "Delete Drive footage older than this. 0 = keep everything."
        required: false

concurrency:
  group: camera-archive
  # Never cancel a run in flight: it may be mid-upload, and a truncated file
  # on Drive is worse than a missing one - the next pass would see it present
  # and skip it. (archive_vods.py guards against that with a size check, but
  # not cancelling is the cheaper protection.)
  #
  # This cannot pile up: GitHub keeps at most one pending run per concurrency
  # group and discards the older one, so the queue is never deeper than one -
  # and that pending run is what takes over when this loop exits.
  cancel-in-progress: false

permissions:
  # Read-only: unlike the summary workflow this publishes no site and needs no
  # gh-pages branch. Everything it produces goes to Drive.
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    # Required. Secrets stored on the environment rather than the repository
    # resolve to an EMPTY STRING without this, and the job then fails at
    # "Configure rclone" looking exactly as though no secret had been set.
    # camera-access has no protection rules, so this adds no approval step.
    environment: camera-access
    # Actions hard-caps a job at 6 hours; the loop stops itself at
    # LOOP_MINUTES well before that.
    timeout-minutes: 355
    env:
      # Runners are UTC. The day folders on Drive MUST agree with the NAS and
      # the stream workflow or the three write the same footage under
      # different day boundaries - a UTC day rolls over at 17:00 local.
      TZ: America/Vancouver

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Deliberately lean: yt-dlp to fetch and rclone to upload. No
          # opencv/numpy/tesseract - that is the summary job's analysis
          # toolchain and this job only moves files.
          python3 -m pip install --break-system-packages --quiet yt-dlp
          curl -fsSL https://rclone.org/install.sh | sudo bash
          python3 -m yt_dlp --version
          rclone version | head -1

      - name: Configure rclone
        env:
          # Accept the usual spellings, because a secret under a name this job
          # does not read looks identical to no secret at all. Which one is
          # present is reported below by LENGTH ONLY - a value is never echoed.
          CONF_A: ${{ secrets.RCLONE_CONF }}
          CONF_B: ${{ secrets.RCLONE_CONFIG }}
          CONF_C: ${{ secrets.GDRIVE_RCLONE_CONF }}
          CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          CONF_VAR: ${{ vars.RCLONE_CONF }}
        run: |
          echo "Candidates visible to this job (length only, never the value):"
          for n in CONF_A CONF_B CONF_C CONF_B64 CONF_VAR; do
            eval "v=\${$n}"
            echo "  $n: ${#v} chars"
          done

          CONF="${CONF_A:-${CONF_B:-${CONF_C:-${CONF_VAR:-}}}}"
          if [ -z "$CONF" ] && [ -n "$CONF_B64" ]; then
            echo "decoding the base64 variant"
            CONF="$(printf '%s' "$CONF_B64" | base64 -d)"
          fi

          if [ -z "$CONF" ]; then
            echo "::error::No rclone config reached this job."
            echo "::error::Add it as a SECRET named RCLONE_CONF - either on the"
            echo "::error::repository or on the camera-access environment."
            echo "::error::A VARIABLE of that name will not work for secrets."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          printf '%s' "$CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

          # Pasting through some editors turns real newlines into literal \n,
          # which leaves a file rclone cannot parse. Detect and repair.
          if ! grep -q '^\[' ~/.config/rclone/rclone.conf; then
            echo "no [section] header found - repairing escaped newlines"
            printf '%b' "$CONF" > ~/.config/rclone/rclone.conf
          fi

          echo "remotes found:"
          rclone listremotes

      - name: Archive on a loop
        env:
          TWITCH_CHANNEL: ${{ secrets.TWITCH_CHANNEL || 'elarathornfield168' }}
          RCLONE_REMOTE: gdrive:camera_archive
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '26' }}
          RETAIN_DAYS: ${{ inputs.retain_days || '0' }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '330' }}
          # twitch.sh closes the RTMP connection every COMBINE_SEGMENTS (20)
          # minutes, and every close ends a broadcast and starts a new VOD.
          # So roughly one new VOD every 20 minutes - checking faster than
          # that only re-lists the same set.
          INTERVAL_MINUTES: '20'
        run: |
          set -u

          pass() {
            # Give each pass most of the interval, leaving room to upload and
            # push state before the next one is due.
            BUDGET_SECONDS=$(( INTERVAL_MINUTES * 60 - 120 )) \
              python3 archive_vods.py
          }

          if [ "$LOOP_MINUTES" = "0" ]; then
            echo "single pass"
            pass
            exit $?
          fi

          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            n=$(( n + 1 ))
            echo "=============== pass $n ==============="
            t0=$(date +%s)
            # A failed pass must never end the loop: Twitch holds the VOD for
            # 7 days, so the next pass simply picks up what this one missed.
            pass || echo "pass $n returned non-zero - continuing"
            took=$(( $(date +%s) - t0 ))

            # Stop if there is not enough time left for another useful pass.
            left=$(( end - $(date +%s) ))
            if [ "$left" -lt 300 ]; then
              echo "only ${left}s of loop left - exiting cleanly"
              break
            fi

            nap=$(( INTERVAL_MINUTES * 60 - took ))
            if [ "$nap" -gt 0 ]; then
              [ "$nap" -gt "$left" ] && nap=$left
              echo "pass took ${took}s - sleeping ${nap}s"
              sleep "$nap"
            else
              echo "pass took ${took}s - already past the interval, going again"
            fi
          done

          echo "loop finished after $n pass(es)"

      - name: What is on Drive now
        if: always()
        env:
          RCLONE_REMOTE: gdrive:camera_archive
        run: |
          echo "day folders under vods/ (newest 10):"
          rclone lsjson --dirs-only "$RCLONE_REMOTE/vods" 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print('  '+x['Name']) for x in sorted(d,key=lambda y:y['Name'],reverse=True)[:10]]" \
            || echo "  (none yet)"
          echo "archived index:"
          rclone cat "$RCLONE_REMOTE/state/vods_archived.json" 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('  %d VODs, %.1f GB' % (len(d), sum(v.get('size',0) for v in d.values())/2**30))" \
            || echo "  (no index yet)"
