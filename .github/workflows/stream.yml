name: Camera Stream Workflow

on:
  schedule:
    # Every 2h, NOT every 6h. The job streams for 5h57m, so a 6h cron left
    # zero slack: GitHub fires scheduled ticks 30min-3h late and drops some
    # outright, and every minute of that lateness was a minute of dead air.
    # Measured 11-11..11-24: a 173-307 min hole EVERY day, 3 ticks landing
    # out of 4. Ticking every 2h means a replacement run is nearly always
    # already queued when the live one times out.
    - cron: '0 */2 * * *'
  workflow_dispatch:

# One live stream at a time -- two runs would push to the same Twitch ingest.
#
# cancel-in-progress is FALSE for scheduled ticks on purpose. A queued run
# waits for the live one to finish and then takes over within ~1 min, which is
# what closes the gap; GitHub keeps only the newest pending run and cancels
# the older one, so these do not pile up. A manual workflow_dispatch still
# cancels the live run and takes over immediately -- that is the "restart it
# now" button, and queueing it behind a 6h job would break it.
concurrency:
  group: camera-stream
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: camera-access
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NO manual "curl install.sh" step here on purpose. It installed the
      # CURRENT tailscaled (1.104.x) while the v2 action then dropped its own
      # bundled CLI (1.42.0, from 2023) over /usr/bin/tailscale. `tailscale up`
      # died in 26 ms against a daemon 60 releases newer than the client, with
      # only a version-skew warning to show for it, and every later step was
      # skipped - the stream was down from 11-13 to 11-15 for exactly this.
      # Let the action own both halves so they always match.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:shared
          hostname: github-camera-stream
          args: --accept-routes
      
      - name: Verify Connection
        run: |
          echo "📡 Tailscale Status:"
          tailscale status
          echo ""
          echo "🌐 My IP:"
          tailscale ip -4
          echo ""
          echo "🔍 Testing QNAP connectivity..."
          
          PRIMARY_QNAP="100.81.101.86"   # NAS61536A  (subnet router, primary)
          FAILOVER_QNAP="100.73.152.14"  # NASF604EB  (subnet router, standby)
          
          # Wait for a QNAP rather than giving up on the first ping.
          #
          # The QNAPs are the subnet routers to 192.168.1.0/24 -- no QNAP, no
          # cameras. Both were offline in Tailscale from 11-20 21:30 to 11-23
          # 09:41 MST and this step exited after 24s, so eight consecutive
          # runs died in ~1 min and the stream was down 9-12h at a stretch.
          #
          # Waiting matters MORE now that a replacement run is queued behind
          # this one: a fast exit would release the concurrency group, the
          # queued run would start, fail in a minute, and so on -- a tight
          # retry loop burning runner minutes. Holding the group for up to
          # 30 min bounds retries to ~2/h during a real outage, and picks the
          # stream back up within 30s of the NAS returning.
          DEADLINE=$(( $(date +%s) + 1800 ))
          QNAP_IP=""
          while :; do
            if ping -c 2 -W 3 $PRIMARY_QNAP > /dev/null 2>&1; then
              echo "✅ Primary QNAP reachable ($PRIMARY_QNAP)"
              QNAP_IP=$PRIMARY_QNAP
              break
            elif ping -c 2 -W 3 $FAILOVER_QNAP > /dev/null 2>&1; then
              echo "⚠️ Primary down, using failover QNAP ($FAILOVER_QNAP)"
              QNAP_IP=$FAILOVER_QNAP
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "❌ Both QNAPs unreachable for 30 min -- giving up"
              echo "   primary  $PRIMARY_QNAP (NAS61536A)"
              echo "   failover $FAILOVER_QNAP (NASF604EB)"
              echo "   Check that tailscaled is running on the NAS and that"
              echo "   it is advertising 192.168.1.0/24 as a subnet route."
              exit 1
            fi
            echo "   ...no QNAP yet, retrying in 30s ($(( (DEADLINE - $(date +%s)) / 60 ))m left)"
            sleep 30
          done
          echo "QNAP_IP=$QNAP_IP" >> $GITHUB_ENV
      
      - name: Setup SSH Tunnel to QNAP
        run: |
          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y sshpass socat
          
          echo "Setting up SSH tunnel through QNAP for camera access..."
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl fonts-freefont-ttf python3-pip python3-opencv
          python3 -m pip install --break-system-packages opencv-python-headless numpy requests || true

      
      - name: Setup Environment
        run: |
          mkdir -p /tmp/camera-recordings
          mkdir -p logs
          export TZ="America/Vancouver"
          echo "TZ=America/Vancouver" >> $GITHUB_ENV
          echo "🕐 Current time: $(date)"

      - name: Wait for Routes
        run: |
          echo "⏳ Waiting for subnet routes via $QNAP_IP..."
          sleep 10
          for i in {1..36}; do
            if ip route show table all | grep -q "192.168.1"; then
              echo "✅ Routes established!"
              break
            fi
            echo "Attempt $i/36: Waiting..."
            sleep 5
          done

          if ! ip route show table all | grep -q "192.168.1"; then
            echo "❌ Routes never appeared"
            tailscale status
            exit 1
          fi
      
      - name: Test Camera Access
        env:
          CAM_PASS: ${{ secrets.CAM_PASS }}
          WYZE_PASS: ${{ secrets.WYZE_PASS }}
          REOLINK_PASS: ${{ secrets.REOLINK_PASS }}
        run: |
          echo "🔍 Testing camera connectivity..."
          
          declare -A CAMERAS=(
              ["Office"]="http://192.168.1.31/video.cgi"
              ["Front"]="rtsp://admin:${REOLINK_PASS}@192.168.1.211:554/h264Preview_01_sub"
              ["Kitchen"]="http://admin:${CAM_PASS}@192.168.1.33/video.cgi"
              ["Balcony"]="http://admin:${CAM_PASS}@192.168.1.38/video.cgi"
              ["Backyard"]="http://admin:${CAM_PASS}@192.168.1.39/video.cgi"
              ["Control Room"]="rtsps://harry:${WYZE_PASS}@192.168.1.146:322/stream0"
          )
          
          ONLINE_COUNT=0
          for name in Office Front Kitchen Balcony Backyard "Control Room"; do
              url="${CAMERAS[$name]}"
              [ -z "$url" ] && { echo "⚠️  $name skipped (no URL / secret unset)"; continue; }
              case "$url" in
                  rtsp://*|rtsps://*) probe=(timeout 30 ffmpeg -v error -rtsp_transport tcp -i "$url" -t 1 -f null -) ;;
                  *)                  probe=(timeout 8 curl -s -I "$url") ;;
              esac
              if out=$("${probe[@]}" 2>&1); then
                  echo "✅ $name camera is online"
                  ONLINE_COUNT=$((ONLINE_COUNT + 1))
              else
                  echo "❌ $name camera is offline"
                  case "$url" in
                      rtsp://*|rtsps://*) echo "     ↳ $(echo "$out" | tail -1)" ;;
                  esac
              fi
          done
          
          echo ""
          echo "📹 $ONLINE_COUNT camera(s) accessible — continuing to stream..."
      
      - name: Alert on unreachable cameras
        # Runs on the same Tailscale path the stream uses, so it reports
        # reachability as the stream will actually experience it. Never
        # fails the job: a camera being down is news, not a reason to
        # abandon recording the ones that are up.
        continue-on-error: true
        env:
          CAM_PASS: ${{ secrets.CAM_PASS }}
          WYZE_PASS: ${{ secrets.WYZE_PASS }}
          REOLINK_PASS: ${{ secrets.REOLINK_PASS }}
          SES_SMTP_HOST: ${{ secrets.SES_SMTP_HOST }}
          SES_SMTP_PORT: ${{ secrets.SES_SMTP_PORT }}
          SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SES_SMTP_PASS: ${{ secrets.SES_SMTP_PASS }}
          SES_SMTP_FROM: ${{ secrets.SES_SMTP_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 notify_offline_cameras.py

      - name: Stream to Twitch
        timeout-minutes: 355
        env:
          TWITCH_KEY: ${{ secrets.TWITCH_KEY }}
          CAM_PASS: ${{ secrets.CAM_PASS }}
          WYZE_PASS: ${{ secrets.WYZE_PASS }}
          REOLINK_PASS: ${{ secrets.REOLINK_PASS }}
        run: |
          chmod +x start-stream.sh twitch.sh

          echo "$(date) - 🎥 Starting camera capture (start-stream.sh)..."
          ./start-stream.sh &
          START_STREAM_PID=$!
          echo "start-stream.sh PID: $START_STREAM_PID"

          # Give start-stream.sh time to begin capturing
          sleep 15

          echo "$(date) - 📡 Starting Twitch streamer (twitch.sh)..."
          ./twitch.sh &
          TWITCH_PID=$!
          echo "twitch.sh PID: $TWITCH_PID"

          # Wait for twitch.sh (main controller); if it exits, stop start-stream.sh too
          wait $TWITCH_PID
          echo "$(date) - ✅ twitch.sh finished"

          kill $START_STREAM_PID 2>/dev/null || true
          echo "$(date) - 🛑 start-stream.sh stopped"
      
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

